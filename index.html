<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chess Tournament Manager</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #1e293b;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

header p {
    margin: 8px 0 0;
    color: #cbd5e1;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 20px auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 10px;
}

.player-row {
    display: grid;
    grid-template-columns: 35px 1fr 90px;
    gap: 6px;
    align-items: center;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
    font-size: 15px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    margin: 5px;
    cursor: pointer;
    font-size: 15px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.blue {
    background: #2563eb;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.orange {
    background: #ea580c;
    color: white;
}

.red {
    background: #dc2626;
    color: white;
}

.gray {
    background: #64748b;
    color: white;
}

.matches {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
    gap: 15px;
}

.match {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 15px;
}

.match-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 12px;
}

.player {
    background: white;
    border: 1px solid #cbd5e1;
    padding: 12px;
    border-radius: 8px;
    margin: 6px 0;
}

.winner {
    border: 3px solid #16a34a;
    background: #dcfce7;
}

.draw {
    border: 3px solid #ea580c;
    background: #ffedd5;
}

.result {
    text-align: center;
    font-weight: bold;
    padding: 9px;
    margin: 8px 0;
    border-radius: 7px;
    background: #e2e8f0;
}

.qualified {
    text-align: center;
    padding: 8px;
    border-radius: 7px;
    background: #dcfce7;
    color: #166534;
    font-weight: bold;
    margin-top: 8px;
}

.status {
    background: #eff6ff;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
}

.hidden {
    display: none !important;
}

.champion {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    padding: 30px;
}

.tie-break {
    background: #fff7ed;
    border: 2px solid #fb923c;
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    text-align: center;
}

.round-summary {
    margin-top: 20px;
    padding: 15px;
    background: #f8fafc;
    border-radius: 10px;
    border: 1px solid #cbd5e1;
}

.summary-row {
    display: grid;
    grid-template-columns: 40px 1fr 80px 1fr 120px;
    gap: 8px;
    padding: 8px;
    border-bottom: 1px solid #e2e8f0;
    align-items: center;
}

.summary-row:last-child {
    border-bottom: none;
}

.small-result {
    text-align: center;
    font-weight: bold;
}

.notice {
    padding: 10px;
    background: #fef3c7;
    border-radius: 8px;
    margin: 10px 0;
}

@media (max-width: 600px) {

    .player-row {
        grid-template-columns: 30px 1fr 80px;
    }

    .summary-row {
        grid-template-columns: 30px 1fr 70px 1fr;
    }

    .summary-qualified {
        grid-column: 2 / -1;
    }

    button {
        width: calc(100% - 10px);
    }
}

</style>

</head>


<body>


<header>

<h1>♟️ Chess Tournament Manager</h1>

<p>إدارة بطولة الشطرنج</p>

</header>


<div class="container">


<!-- شاشة اللاعبين -->

<div
    class="card"
    id="playersScreen"
>

<h2>👥 اللاعبين المتأهلين</h2>

<p>
أدخل أسماء اللاعبين وتقييماتهم.
</p>

<div
    class="players-grid"
    id="playersContainer"
></div>

<br>

<button
    type="button"
    class="gray"
    onclick="fillExample()"
>
🧪 تعبئة تجريبية
</button>

<button
    type="button"
    class="blue"
    onclick="startTournament()"
>
🎯 إنشاء البطولة
</button>

</div>


<!-- شاشة البطولة -->

<div
    class="card hidden"
    id="tournamentScreen"
>

<h2 id="roundTitle">
دور الـ32
</h2>

<div
    class="status"
    id="status"
>
لم يتم حسم أي مباراة.
</div>

<div
    class="matches"
    id="matchesContainer"
></div>


<div
    class="round-summary"
>

<h3>📋 نتائج الجولة</h3>

<div id="summaryContainer"></div>

</div>


<br>

<button
    type="button"
    class="red"
    onclick="newTournament()"
>
🗑️ بدء بطولة جديدة
</button>

</div>


<!-- شاشة البطل -->

<div
    class="card hidden"
    id="championScreen"
>

<div class="champion">

🏆

<br><br>

بطل البطولة

<br><br>

<span id="championName"></span>

<br><br>

<button
    type="button"
    class="red"
    onclick="newTournament()"
>
🗑️ بطولة جديدة
</button>

</div>

</div>


</div>


<script>


/* ================================
   بيانات البطولة
================================ */

let players = [];

let rounds = [];

let currentRound = 0;


/* ================================
   إنشاء خانات اللاعبين
================================ */

function createPlayerInputs() {

    const container =
        document.getElementById("playersContainer");

    if (!container) {
        return;
    }

    container.innerHTML = "";

    for (let i = 1; i <= 32; i++) {

        const row =
            document.createElement("div");

        row.className = "player-row";

        row.innerHTML = `
            <strong>${i}</strong>

            <input
                type="text"
                id="name-${i}"
                placeholder="اسم اللاعب"
            >

            <input
                type="number"
                id="rating-${i}"
                placeholder="Rating"
            >
        `;

        container.appendChild(row);
    }
}


/* ================================
   التعبئة التجريبية
================================ */

function fillExample() {

    for (let i = 1; i <= 32; i++) {

        const nameInput =
            document.getElementById("name-" + i);

        const ratingInput =
            document.getElementById("rating-" + i);

        if (nameInput) {
            nameInput.value = "Player " + i;
        }

        if (ratingInput) {
            ratingInput.value =
                2300 - ((i - 1) * 10);
        }
    }

    alert("تمت تعبئة بيانات 32 لاعبًا.");
}


/* ================================
   قراءة اللاعبين
================================ */

function readPlayers() {

    const list = [];

    for (let i = 1; i <= 32; i++) {

        const nameElement =
            document.getElementById("name-" + i);

        const ratingElement =
            document.getElementById("rating-" + i);

        if (!nameElement || !ratingElement) {

            alert("حدث خطأ في خانات اللاعبين.");

            return null;
        }

        const name =
            nameElement.value.trim();

        const rating =
            Number(ratingElement.value) || 0;

        if (!name) {

            alert(
                "من فضلك أدخل اسم اللاعب رقم " + i
            );

            return null;
        }

        list.push({

            seed: i,

            name: name,

            rating: rating

        });
    }

    return list;
}


/* ================================
   مباريات دور الـ32
================================ */

function createRound32(list) {

    const pairs = [

        [1,32],
        [16,17],
        [8,25],
        [9,24],
        [4,29],
        [13,20],
        [5,28],
        [12,21],

        [2,31],
        [15,18],
        [7,26],
        [10,23],
        [3,30],
        [14,19],
        [6,27],
        [11,22]

    ];

    return pairs.map(function(pair, index) {

        return {

            number: index + 1,

            player1: list[pair[0] - 1],

            player2: list[pair[1] - 1],

            winner: null,

            result: null,

            draw: false

        };

    });
}


/* ================================
   بدء البطولة
================================ */

function startTournament() {

    const list = readPlayers();

    if (!list) {
        return;
    }

    players = list;

    rounds = [

        {
            name: "دور الـ32",
            matches: createRound32(players)
        }

    ];

    currentRound = 0;

    saveTournament();

    showTournamentScreen();

    renderRound();
}


/* ================================
   إظهار شاشة البطولة
================================ */

function showTournamentScreen() {

    document
        .getElementById("playersScreen")
        .classList
        .add("hidden");

    document
        .getElementById("championScreen")
        .classList
        .add("hidden");

    document
        .getElementById("tournamentScreen")
        .classList
        .remove("hidden");
}


/* ================================
   عرض الجولة
================================ */

function renderRound() {

    const round = rounds[currentRound];

    if (!round) {
        return;
    }

    document
        .getElementById("roundTitle")
        .textContent = round.name;

    const container =
        document.getElementById("matchesContainer");

    container.innerHTML = "";


    round.matches.forEach(function(match, index) {

        const box =
            document.createElement("div");

        box.className = "match";


        let p1Class = "player";
        let p2Class = "player";


        if (match.winner === match.player1) {
            p1Class += " winner";
        }

        if (match.winner === match.player2) {
            p2Class += " winner";
        }

        if (match.draw) {
            p1Class += " draw";
            p2Class += " draw";
        }


        let resultHTML = "";

        if (match.result) {

            resultHTML = `
                <div class="result">
                    النتيجة: ${match.result}
                </div>
            `;
        }


        let qualifiedHTML = "";

        if (match.winner && !match.draw) {

            qualifiedHTML = `
                <div class="qualified">
                    ✅ المتأهل:
                    ${match.winner.name}
                </div>
            `;
        }


        let tieBreakHTML = "";

        if (match.draw && !match.winner) {

            tieBreakHTML = `
                <div class="tie-break">

                    <strong>
                        المباراة انتهت بالتعادل
                    </strong>

                    <br><br>

                    اختر اللاعب المتأهل:

                    <br>

                    <button
                        type="button"
                        class="green"
                        onclick="resolveDraw(${index}, 1)"
                    >
                        يتأهل ${match.player1.name}
                    </button>

                    <button
                        type="button"
                        class="green"
                        onclick="resolveDraw(${index}, 2)"
                    >
                        يتأهل ${match.player2.name}
                    </button>

                </div>
            `;
        }


        box.innerHTML = `

            <div class="match-title">
                المباراة ${index + 1}
            </div>


            <div class="${p1Class}">

                <strong>
                    ${match.player1.seed}.
                </strong>

                ${match.player1.name}

                <br>

                <small>
                    Rating:
                    ${match.player1.rating}
                </small>

            </div>


            <div style="text-align:center">
                ⚔️ VS ⚔️
            </div>


            <div class="${p2Class}">

                <strong>
                    ${match.player2.seed}.
                </strong>

                ${match.player2.name}

                <br>

                <small>
                    Rating:
                    ${match.player2.rating}
                </small>

            </div>


            ${resultHTML}


            <button
                type="button"
                class="green"
                onclick="setResult(${index}, 1)"
                ${match.result ? "disabled" : ""}
            >
                فوز اللاعب الأول
            </button>


            <button
                type="button"
                class="orange"
                onclick="setResult(${index}, 0)"
                ${match.result ? "disabled" : ""}
            >
                تعادل
            </button>


            <button
                type="button"
                class="green"
                onclick="setResult(${index}, 2)"
                ${match.result ? "disabled" : ""}
            >
                فوز اللاعب الثاني
            </button>


            ${qualifiedHTML}

            ${tieBreakHTML}

        `;


        container.appendChild(box);

    });


    updateStatus();

    renderSummary();
}


/* ================================
   تسجيل النتيجة
================================ */

function setResult(index, result) {

    const round =
        rounds[currentRound];

    if (!round) {
        return;
    }

    const match =
        round.matches[index];

    if (!match) {
        alert("المباراة غير موجودة.");
        return;
    }

    if (match.result) {
        return;
    }


    if (result === 1) {

        match.result = "1 - 0";

        match.winner =
            match.player1;

        match.draw = false;
    }


    else if (result === 2) {

        match.result = "0 - 1";

        match.winner =
            match.player2;

        match.draw = false;
    }


    else {

        match.result = "½ - ½";

        match.winner = null;

        match.draw = true;
    }


    saveTournament();

    renderRound();

    checkRoundFinished();
}


/* ================================
   حسم التعادل
================================ */

function resolveDraw(index, player) {

    const round =
        rounds[currentRound];

    if (!round) {
        return;
    }

    const match =
        round.matches[index];

    if (!match) {
        return;
    }

    if (!match.draw) {
        return;
    }


    if (player === 1) {

        match.winner =
            match.player1;
    }

    else {

        match.winner =
            match.player2;
    }


    match.draw = false;


    saveTournament();

    renderRound();

    checkRoundFinished();
}


/* ================================
   فحص انتهاء الجولة
================================ */

function checkRoundFinished() {

    const round =
        rounds[currentRound];

    if (!round) {
        return;
    }


    const finished =
        round.matches.every(function(match) {

            return match.winner !== null;

        });


    if (finished) {

        setTimeout(function() {

            nextRound();

        }, 700);
    }
}


/* ================================
   الجولة التالية
================================ */

function nextRound() {

    const current =
        rounds[currentRound];

    if (!current) {
        return;
    }


    const winners =
        current.matches.map(function(match) {

            return match.winner;

        });


    if (winners.length === 1) {

        showChampion(
            winners[0]
        );

        return;
    }


    const roundNames = [

        "دور الـ16",

        "ربع النهائي",

        "نصف النهائي",

        "النهائي"

    ];


    const nextMatches = [];


    for (
        let i = 0;
        i < winners.length;
        i += 2
    ) {

        nextMatches.push({

            number: (i / 2) + 1,

            player1: winners[i],

            player2: winners[i + 1],

            winner: null,

            result: null,

            draw: false

        });
    }


    rounds.push({

        name:
            roundNames[currentRound],

        matches:
            nextMatches

    });


    currentRound++;


    saveTournament();

    renderRound();
}


/* ================================
   تحديث الحالة
================================ */

function updateStatus() {

    const round =
        rounds[currentRound];

    if (!round) {
        return;
    }


    const total =
        round.matches.length;


    let finished = 0;


    round.matches.forEach(function(match) {

        if (match.winner !== null) {
            finished++;
        }

    });


    document
        .getElementById("status")
        .textContent =

        "تم حسم تأهل " +
        finished +
        " من " +
        total +
        " مباريات في " +
        round.name +
        ".";
}


/* ================================
   ملخص الجولة
================================ */

function renderSummary() {

    const round =
        rounds[currentRound];

    if (!round) {
        return;
    }


    const container =
        document.getElementById(
            "summaryContainer"
        );

    container.innerHTML = "";


    round.matches.forEach(function(match, index) {

        let result =
            match.result || "—";


        let qualified =
            "لم يحسم بعد";


        if (match.winner) {

            qualified =
                match.winner.name;
        }


        const row =
            document.createElement("div");

        row.className =
            "summary-row";


        row.innerHTML = `

            <div>
                ${index + 1}
            </div>

            <div>
                ${match.player1.name}
            </div>

            <div class="small-result">
                ${result}
            </div>

            <div>
                ${match.player2.name}
            </div>

            <div class="summary-qualified">
                ${qualified}
            </div>

        `;


        container.appendChild(row);

    });
}


/* ================================
   حفظ البطولة
================================ */

function saveTournament() {

    try {

        const data = {

            players: players,

            rounds: rounds,

            currentRound: currentRound

        };


        localStorage.setItem(
            "chessTournament",
            JSON.stringify(data)
        );

    }

    catch (error) {

        console.log(
            "تعذر حفظ البطولة:",
            error
        );
    }
}


/* ================================
   تحميل البطولة
================================ */

function loadTournament() {

    const saved =
        localStorage.getItem(
            "chessTournament"
        );


    if (!saved) {

        createPlayerInputs();

        return;
    }


    try {

        const data =
            JSON.parse(saved);


        players =
            Array.isArray(data.players)
                ? data.players
                : [];


        rounds =
            Array.isArray(data.rounds)
                ? data.rounds
                : [];


        currentRound =
            Number(data.currentRound) || 0;


        if (
            rounds.length > 0 &&
            currentRound < rounds.length
        ) {

            showTournamentScreen();

            renderRound();


            const current =
                rounds[currentRound];


            if (
                current.matches.length === 1 &&
                current.matches[0].winner
            ) {

                showChampion(
                    current.matches[0].winner
                );
            }

        }

        else {

            createPlayerInputs();

        }

    }

    catch (error) {

        console.log(
            "خطأ في تحميل البطولة:",
            error
        );


        localStorage.removeItem(
            "chessTournament"
        );


        players = [];

        rounds = [];

        currentRound = 0;


        createPlayerInputs();

    }
}


/* ================================
   عرض البطل
================================ */

function showChampion(winner) {

    if (!winner) {
        return;
    }


    document
        .getElementById(
            "tournamentScreen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "playersScreen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "championScreen"
        )
        .classList
        .remove("hidden");


    document
        .getElementById(
            "championName"
        )
        .textContent =
        winner.name;


    saveTournament();
}


/* ================================
   بطولة جديدة
================================ */

function newTournament() {

    const answer =
        confirm(
            "هل أنت متأكد من بدء بطولة جديدة؟\n\nسيتم حذف البطولة الحالية."
        );


    if (!answer) {
        return;
    }


    localStorage.removeItem(
        "chessTournament"
    );


    players = [];

    rounds = [];

    currentRound = 0;


    document
        .getElementById(
            "tournamentScreen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "championScreen"
        )
        .classList
        .add("hidden");


    document
        .getElementById(
            "playersScreen"
        )
        .classList
        .remove("hidden");


    createPlayerInputs();
}


/* ================================
   تشغيل التطبيق
================================ */

createPlayerInputs();

loadTournament();


</script>

</body>

</html>
