<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chess Tournament Manager</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        header p {
            margin: 8px 0 0;
            color: #cbd5e1;
        }

        .container {
            width: 95%;
            max-width: 1100px;
            margin: 20px auto;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .players-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 10px;
        }

        .player-row {
            display: grid;
            grid-template-columns: 35px 1fr 90px;
            gap: 6px;
            align-items: center;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 11px 16px;
            margin: 5px;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .blue {
            background: #2563eb;
            color: white;
        }

        .green {
            background: #16a34a;
            color: white;
        }

        .gray {
            background: #64748b;
            color: white;
        }

        .matches {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .match {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px;
        }

        .match-title {
            font-weight: bold;
            text-align: center;
            margin-bottom: 12px;
        }

        .player {
            background: white;
            border: 1px solid #cbd5e1;
            padding: 12px;
            border-radius: 8px;
            margin: 6px 0;
        }

        .winner {
            border: 3px solid #16a34a;
            background: #dcfce7;
        }

        .status {
            background: #eff6ff;
            padding: 12px;
            border-radius: 8px;
            margin: 15px 0;
        }

        .hidden {
            display: none;
        }

        .champion {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            padding: 30px;
        }

        @media (max-width: 600px) {

            .player-row {
                grid-template-columns: 30px 1fr 80px;
            }

            button {
                width: calc(100% - 10px);
            }

        }

    </style>

</head>


<body>

<header>

    <h1>♟️ Chess Tournament Manager</h1>

    <p>
        إدارة بطولة الشطرنج
    </p>

</header>


<div class="container">


    <!-- ========================= -->
    <!-- شاشة اللاعبين -->
    <!-- ========================= -->

    <div class="card" id="playersScreen">

        <h2>👥 اللاعبين المتأهلين</h2>

        <p>
            أدخل أسماء اللاعبين وتقييماتهم.
        </p>

        <div
            class="players-grid"
            id="playersContainer">
        </div>

        <br>

        <button
            type="button"
            class="gray"
            onclick="alert('الزر شغال')"

            🧪 تعبئة تجريبية

        </button>


        <button
            type="button"
            class="blue"
            onclick="startTournament()">

            🎯 إنشاء البطولة

        </button>

    </div>


    <!-- ========================= -->
    <!-- شاشة البطولة -->
    <!-- ========================= -->

    <div
        class="card hidden"
        id="tournamentScreen">

        <h2 id="roundTitle">
            دور الـ32
        </h2>

        <div
            class="status"
            id="status">

            لم يتم حسم أي مباراة بعد.

        </div>

        <div
            class="matches"
            id="matchesContainer">
        </div>

    </div>


    <!-- ========================= -->
    <!-- شاشة البطل -->
    <!-- ========================= -->

    <div
        class="card hidden"
        id="championScreen">

        <div class="champion">

            🏆

            <br><br>

            بطل البطولة

            <br><br>

            <span id="championName"></span>

        </div>

    </div>


</div>


<script>


/* =========================================
   متغيرات البطولة
========================================= */

let players = [];

let rounds = [];

let currentRound = 0;


/* =========================================
   إنشاء خانات اللاعبين
========================================= */

function createPlayerInputs() {

    const container =
        document.getElementById("playersContainer");

    container.innerHTML = "";


    for (let i = 1; i <= 32; i++) {

        const row =
            document.createElement("div");

        row.className = "player-row";


        row.innerHTML = `

            <strong>${i}</strong>

            <input
                type="text"
                id="name-${i}"
                placeholder="اسم اللاعب">

            <input
                type="number"
                id="rating-${i}"
                placeholder="Rating">

        `;


        container.appendChild(row);

    }

}


/* =========================================
   تعبئة تجريبية
========================================= */

function fillExample() {

    for (let i = 1; i <= 32; i++) {

        const nameInput =
            document.getElementById("name-" + i);

        const ratingInput =
            document.getElementById("rating-" + i);


        if (nameInput) {

            nameInput.value =
                "Player " + i;

        }


        if (ratingInput) {

            ratingInput.value =
                2300 - ((i - 1) * 10);

        }

    }


    alert("تمت تعبئة بيانات تجريبية لـ32 لاعبًا");

}


/* =========================================
   قراءة اللاعبين
========================================= */

function readPlayers() {

    const list = [];


    for (let i = 1; i <= 32; i++) {

        const name =
            document.getElementById("name-" + i)
            .value
            .trim();


        const rating =
            Number(
                document.getElementById("rating-" + i)
                .value
            );


        if (name === "") {

            alert(
                "من فضلك أدخل اسم اللاعب رقم " + i
            );

            return null;

        }


        list.push({

            seed: i,

            name: name,

            rating: rating,

            winner: false

        });

    }


    return list;

}


/* =========================================
   إنشاء مباريات دور الـ32
========================================= */

function createRound32(list) {

    const pairings = [

        [1, 32],

        [16, 17],

        [8, 25],

        [9, 24],

        [4, 29],

        [13, 20],

        [5, 28],

        [12, 21],

        [2, 31],

        [15, 18],

        [7, 26],

        [10, 23],

        [3, 30],

        [14, 19],

        [6, 27],

        [11, 22]

    ];


    const matches = [];


    pairings.forEach(
        function(pair, index) {

            matches.push({

                number: index + 1,

                player1:
                    list[pair[0] - 1],

                player2:
                    list[pair[1] - 1],

                winner: null

            });

        }
    );


    return matches;

}


/* =========================================
   بدء البطولة
========================================= */

function startTournament() {

    const list = readPlayers();


    if (!list) {

        return;

    }


    players = list;


    rounds = [

        {

            name: "دور الـ32",

            matches:
                createRound32(players)

        }

    ];


    currentRound = 0;


    document
        .getElementById("playersScreen")
        .classList
        .add("hidden");


    document
        .getElementById("tournamentScreen")
        .classList
        .remove("hidden");


    renderRound();

}


/* =========================================
   عرض الجولة
========================================= */

function renderRound() {

    const round =
        rounds[currentRound];


    if (!round) {

        return;

    }


    document
        .getElementById("roundTitle")
        .textContent =
        round.name;


    const container =
        document
        .getElementById("matchesContainer");


    container.innerHTML = "";


    round.matches.forEach(
        function(match, index) {


            const box =
                document.createElement("div");


            box.className = "match";


            const player1Winner =
                match.winner === match.player1;


            const player2Winner =
                match.winner === match.player2;


            box.innerHTML = `

                <div class="match-title">

                    المباراة ${index + 1}

                </div>


                <div
                    class="player ${player1Winner ? "winner" : ""}">

                    <strong>
                        ${match.player1.seed}.
                    </strong>

                    ${match.player1.name}

                    <br>

                    <small>
                        Rating:
                        ${match.player1.rating}
                    </small>

                </div>


                <button
                    type="button"
                    class="green"
                    onclick="selectWinner(${index}, 1)"
                    ${match.winner !== null ? "disabled" : ""}>

                    فوز اللاعب الأول

                </button>


                <div style="text-align:center">

                    ⚔️ VS ⚔️

                </div>


                <div
                    class="player ${player2Winner ? "winner" : ""}">

                    <strong>
                        ${match.player2.seed}.
                    </strong>

                    ${match.player2.name}

                    <br>

                    <small>
                        Rating:
                        ${match.player2.rating}
                    </small>

                </div>


                <button
                    type="button"
                    class="green"
                    onclick="selectWinner(${index}, 2)"
                    ${match.winner !== null ? "disabled" : ""}>

                    فوز اللاعب الثاني

                </button>

            `;


            container.appendChild(box);

        }
    );


    updateStatus();

}


/* =========================================
   اختيار الفائز
========================================= */

function selectWinner(
    matchIndex,
    playerNumber
) {

    const round =
        rounds[currentRound];


    if (!round) {

        alert("الجولة غير موجودة");

        return;

    }


    const match =
        round.matches[matchIndex];


    if (!match) {

        alert("المباراة غير موجودة");

        return;

    }


    if (match.winner !== null) {

        return;

    }


    if (playerNumber === 1) {

        match.winner =
            match.player1;

    }

    else if (playerNumber === 2) {

        match.winner =
            match.player2;

    }


    renderRound();


    const finished =
        round.matches.every(
            function(match) {

                return match.winner !== null;

            }
        );


    if (finished) {

        setTimeout(
            function() {

                nextRound();

            },
            700
        );

    }

}


/* =========================================
   الجولة التالية
========================================= */

function nextRound() {

    const current =
        rounds[currentRound];


    const winners =
        current.matches.map(
            function(match) {

                return match.winner;

            }
        );


    if (winners.length === 1) {

        document
            .getElementById("tournamentScreen")
            .classList
            .add("hidden");


        document
            .getElementById("championScreen")
            .classList
            .remove("hidden");


        document
            .getElementById("championName")
            .textContent =
            winners[0].name;


        return;

    }


    const names = [

        "دور الـ16",

        "ربع النهائي",

        "نصف النهائي",

        "النهائي"

    ];


    const nextName =
        names[currentRound];


    const nextMatches = [];


    for (
        let i = 0;
        i < winners.length;
        i += 2
    ) {


        nextMatches.push({

            number:
                (i / 2) + 1,

            player1:
                winners[i],

            player2:
                winners[i + 1],

            winner: null

        });

    }


    rounds.push({

        name: nextName,

        matches: nextMatches

    });


    currentRound++;


    renderRound();

}


/* =========================================
   تحديث حالة الجولة
========================================= */

function updateStatus() {

    const round =
        rounds[currentRound];


    if (!round) {

        return;

    }


    const total =
        round.matches.length;


    let finished = 0;


    round.matches.forEach(
        function(match) {

            if (match.winner !== null) {

                finished++;

            }

        }
    );


    document
        .getElementById("status")
        .textContent =
        "تم حسم " +
        finished +
        " من " +
        total +
        " مباريات في " +
        round.name +
        ".";

}


/* =========================================
   تشغيل البرنامج
========================================= */

createPlayerInputs();


</script>

</body>

</html>
