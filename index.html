<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chess Tournament Manager</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #1e293b;
}

header {
    background: #1e293b;
    color: white;
    padding: 20px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 20px auto;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(260px,1fr));
    gap: 10px;
}

.player-row {
    display: grid;
    grid-template-columns: 35px 1fr 90px;
    gap: 6px;
    align-items: center;
}

input {
    width: 100%;
    padding: 10px;
    border: 1px solid #cbd5e1;
    border-radius: 7px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 15px;
    margin: 5px;
    cursor: pointer;
    font-size: 15px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.blue {
    background: #2563eb;
    color: white;
}

.green {
    background: #16a34a;
    color: white;
}

.orange {
    background: #ea580c;
    color: white;
}

.red {
    background: #dc2626;
    color: white;
}

.gray {
    background: #64748b;
    color: white;
}

.matches {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(290px,1fr));
    gap: 15px;
}

.match {
    background: #f8fafc;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    padding: 15px;
}

.match-title {
    text-align: center;
    font-weight: bold;
    margin-bottom: 12px;
}

.player {
    background: white;
    border: 1px solid #cbd5e1;
    padding: 12px;
    border-radius: 8px;
    margin: 6px 0;
}

.winner {
    border: 3px solid #16a34a;
    background: #dcfce7;
}

.draw {
    border: 3px solid #ea580c;
    background: #ffedd5;
}

.result {
    text-align: center;
    font-weight: bold;
    padding: 8px;
    margin: 8px 0;
    border-radius: 7px;
    background: #e2e8f0;
}

.status {
    background: #eff6ff;
    padding: 12px;
    border-radius: 8px;
    margin: 15px 0;
}

.hidden {
    display: none;
}

.champion {
    text-align: center;
    font-size: 28px;
    font-weight: bold;
    padding: 30px;
}

.tie-break {
    background: #fff7ed;
    border: 2px solid #fb923c;
    border-radius: 8px;
    padding: 10px;
    margin-top: 10px;
    text-align: center;
}

</style>
</head>


<body>

<header>

<h1>♟️ Chess Tournament Manager</h1>

<p>إدارة بطولة الشطرنج</p>

</header>


<div class="container">


<!-- اللاعبين -->

<div class="card" id="playersScreen">

<h2>👥 اللاعبين المتأهلين</h2>

<p>
أدخل أسماء اللاعبين وتقييماتهم.
</p>

<div
class="players-grid"
id="playersContainer">
</div>

<br>

<button
type="button"
class="gray"
onclick="fillExample()">

🧪 تعبئة تجريبية

</button>


<button
type="button"
class="blue"
onclick="startTournament()">

🎯 إنشاء البطولة

</button>

</div>


<!-- البطولة -->

<div
class="card hidden"
id="tournamentScreen">

<h2 id="roundTitle">
دور الـ32
</h2>

<div
class="status"
id="status">
لم يتم حسم أي مباراة.
</div>

<div
class="matches"
id="matchesContainer">
</div>

</div>


<!-- البطل -->

<div
class="card hidden"
id="championScreen">

<div class="champion">

🏆

<br><br>

بطل البطولة

<br><br>

<span id="championName"></span>

</div>

</div>


</div>


<script>


let players = [];

let rounds = [];

let currentRound = 0;


/* إنشاء اللاعبين */

function createPlayerInputs() {

const container =
document.getElementById("playersContainer");

container.innerHTML = "";

for(let i=1;i<=32;i++){

const row =
document.createElement("div");

row.className = "player-row";

row.innerHTML = `

<strong>${i}</strong>

<input
type="text"
id="name-${i}"
placeholder="اسم اللاعب">

<input
type="number"
id="rating-${i}"
placeholder="Rating">

`;

container.appendChild(row);

}

}


/* تعبئة تجريبية */

function fillExample(){

for(let i=1;i<=32;i++){

document.getElementById("name-"+i).value =
"Player "+i;

document.getElementById("rating-"+i).value =
2300-((i-1)*10);

}

alert("تمت تعبئة بيانات 32 لاعبًا");

}


/* قراءة اللاعبين */

function readPlayers(){

const list=[];

for(let i=1;i<=32;i++){

const name =
document.getElementById("name-"+i)
.value.trim();

const rating =
Number(
document.getElementById("rating-"+i).value
);

if(!name){

alert("أدخل اسم اللاعب رقم "+i);

return null;

}

list.push({

seed:i,

name:name,

rating:rating

});

}

return list;

}


/* مباريات دور 32 */

function createRound32(list){

const pairs=[

[1,32],
[16,17],
[8,25],
[9,24],
[4,29],
[13,20],
[5,28],
[12,21],

[2,31],
[15,18],
[7,26],
[10,23],
[3,30],
[14,19],
[6,27],
[11,22]

];

return pairs.map(function(pair,index){

return {

number:index+1,

player1:list[pair[0]-1],

player2:list[pair[1]-1],

winner:null,

result:null,

draw:false

};

});

}


/* بدء البطولة */

function startTournament(){

const list=readPlayers();

if(!list)return;

players=list;

rounds=[{

name:"دور الـ32",

matches:createRound32(players)

}];

currentRound=0;

document
.getElementById("playersScreen")
.classList.add("hidden");

document
.getElementById("tournamentScreen")
.classList.remove("hidden");

renderRound();

}


/* عرض الجولة */

function renderRound(){

const round=rounds[currentRound];

document.getElementById("roundTitle")
.textContent=round.name;

const container=
document.getElementById("matchesContainer");

container.innerHTML="";


round.matches.forEach(function(match,index){

const box=
document.createElement("div");

box.className="match";


let p1Class="player";

let p2Class="player";


if(match.winner===match.player1)
p1Class+=" winner";

if(match.winner===match.player2)
p2Class+=" winner";


if(match.draw){

p1Class+=" draw";

p2Class+=" draw";

}


let resultHTML="";


if(match.result){

resultHTML=`

<div class="result">

النتيجة:
${match.result}

</div>

`;

}


let tieBreakHTML="";


if(match.draw && !match.winner){

tieBreakHTML=`

<div class="tie-break">

<strong>
المباراة انتهت بالتعادل
</strong>

<br>

اختر اللاعب المتأهل:

<br>

<button
class="green"
onclick="resolveDraw(${index},1)">

يتأهل ${match.player1.name}

</button>

<button
class="green"
onclick="resolveDraw(${index},2)">

يتأهل ${match.player2.name}

</button>

</div>

`;

}


box.innerHTML=`

<div class="match-title">

المباراة ${index+1}

</div>


<div class="${p1Class}">

<strong>
${match.player1.seed}.
</strong>

${match.player1.name}

<br>

<small>
Rating: ${match.player1.rating}
</small>

</div>


<div style="text-align:center">

⚔️ VS ⚔️

</div>


<div class="${p2Class}">

<strong>
${match.player2.seed}.
</strong>

${match.player2.name}

<br>

<small>
Rating: ${match.player2.rating}
</small>

</div>


${resultHTML}


<button
class="green"
onclick="setResult(${index},1)"
${match.result ? "disabled":""}>

فوز اللاعب الأول

</button>


<button
class="orange"
onclick="setResult(${index},0)"
${match.result ? "disabled":""}>

تعادل

</button>


<button
class="green"
onclick="setResult(${index},2)"
${match.result ? "disabled":""}>

فوز اللاعب الثاني

</button>


${tieBreakHTML}

`;


container.appendChild(box);

});


updateStatus();

}


/* تسجيل النتيجة */

function setResult(index,result){

const match=
rounds[currentRound].matches[index];

if(!match)return;

if(match.result)return;


if(result===1){

match.result="1 - 0";

match.winner=match.player1;

}

else if(result===2){

match.result="0 - 1";

match.winner=match.player2;

}

else{

match.result="½ - ½";

match.draw=true;

}


renderRound();


checkRoundFinished();

}


/* حسم التعادل */

function resolveDraw(index,player){

const match=
rounds[currentRound].matches[index];

if(!match)return;

if(!match.draw)return;

if(player===1){

match.winner=match.player1;

}

else{

match.winner=match.player2;

}

match.draw=false;

renderRound();

checkRoundFinished();

}


/* فحص انتهاء الجولة */

function checkRoundFinished(){

const round=
rounds[currentRound];

const finished=
round.matches.every(function(match){

return match.winner!==null;

});


if(finished){

setTimeout(function(){

nextRound();

},700);

}

}


/* الجولة التالية */

function nextRound(){

const current=
rounds[currentRound];

const winners=
current.matches.map(function(match){

return match.winner;

});


if(winners.length===1){

document
.getElementById("tournamentScreen")
.classList.add("hidden");

document
.getElementById("championScreen")
.classList.remove("hidden");

document
.getElementById("championName")
.textContent=
winners[0].name;

return;

}


const names=[

"دور الـ16",

"ربع النهائي",

"نصف النهائي",

"النهائي"

];


const nextMatches=[];


for(let i=0;i<winners.length;i+=2){

nextMatches.push({

number:(i/2)+1,

player1:winners[i],

player2:winners[i+1],

winner:null,

result:null,

draw:false

});

}


rounds.push({

name:names[currentRound],

matches:nextMatches

});


currentRound++;

renderRound();

}


/* تحديث الحالة */

function updateStatus(){

const round=
rounds[currentRound];

const total=
round.matches.length;

let finished=0;

round.matches.forEach(function(match){

if(match.winner!==null){

finished++;

}

});


document
.getElementById("status")
.textContent=
"تم حسم تأهل "+
finished+
" من "+
total+
" مباريات في "+
round.name+
".";

}


/* تشغيل البرنامج */

createPlayerInputs();


</script>

</body>

</html>
